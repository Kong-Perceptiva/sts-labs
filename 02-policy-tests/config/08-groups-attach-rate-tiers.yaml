# Attaches one request rate limit to each Lab 02 consumer group.
# Same groups and members as config/06-consumer-groups.yaml.
# The policies lists are the only change. The consumers lists stay so membership
# is applied again as the same single member per group.
# Apply config/08-policies-rate-tiers.yaml first.
# Requires AI_GATEWAY_ID and the three consumers from config/05-consumers.yaml.
_defaults:
  kongctl:
    namespace: default

ai_gateway_consumer_groups:
  - ref: sts-lab02-tier-1
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab02-tier-1
    display_name: sts-lab02-tier-1
    consumers:
      - sts-lab02-consumer-t1
    policies:
      - sts-lab02-rate-tier-1

  - ref: sts-lab02-tier-2
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab02-tier-2
    display_name: sts-lab02-tier-2
    consumers:
      - sts-lab02-consumer-t2
    policies:
      - sts-lab02-rate-tier-2

  - ref: sts-lab02-tier-3
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab02-tier-3
    display_name: sts-lab02-tier-3
    consumers:
      - sts-lab02-consumer-t3
    policies:
      - sts-lab02-rate-tier-3
