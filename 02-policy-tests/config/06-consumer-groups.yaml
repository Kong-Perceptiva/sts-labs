# Lab 02 consumer groups with no policies. This file is the unrestricted
# baseline for group scope. Re-apply it to detach the tier request policies.
# consumers is a kongctl membership list of consumer names. It is not a field
# on the Konnect Consumer Group body. kongctl writes it through
# POST /v1/ai-gateways/{aiGatewayId}/consumer-groups/{consumerGroupId}/consumers
# with {"consumer":"<name>"}. Omitting consumers leaves current members in
# place. An empty list clears them. Keep one consumer in each group.
# The consumers must already exist. Requires AI_GATEWAY_ID.
_defaults:
  kongctl:
    namespace: default

ai_gateway_consumer_groups:
  - ref: sts-lab02-tier-1
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab02-tier-1
    display_name: sts-lab02-tier-1
    consumers:
      - sts-lab02-consumer-t1
    policies: []

  - ref: sts-lab02-tier-2
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab02-tier-2
    display_name: sts-lab02-tier-2
    consumers:
      - sts-lab02-consumer-t2
    policies: []

  - ref: sts-lab02-tier-3
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab02-tier-3
    display_name: sts-lab02-tier-3
    consumers:
      - sts-lab02-consumer-t3
    policies: []
