# Attaches sts-lab02-rate-tokens to sts-lab02-chat only.
# Same model spec as config/04-model.yaml. The policies list is the only change.
# Apply config/09-policy-rate-tokens.yaml first. Detach the scenario 2 group
# policies before this file, by re-applying config/06-consumer-groups.yaml.
# Requires AI_GATEWAY_ID, provider sts-lab02-openai, and auth strategy
# sts-lab02-key-auth.
_defaults:
  kongctl:
    namespace: default

ai_gateway_models:
  - ref: sts-lab02-chat
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    type: model
    name: sts-lab02-chat
    display_name: sts-lab02-chat
    capabilities: [generate]
    formats: [{type: openai}]
    access:
      auth_strategies: [sts-lab02-key-auth]
    config:
      route:
        paths: [/v1]
        model:
          body_param: model
          values: [sts-lab02-chat]
    targets:
      - name: gpt-4o-mini
        provider: sts-lab02-openai
        config:
          type: openai
    policies:
      - sts-lab02-rate-tokens
