# Scenario 1. Request rate limit of 3 per minute, counted per consumer.
# The policy is not global. It does nothing until a model lists its name.
# Requires AI_GATEWAY_ID.
_defaults:
  kongctl:
    namespace: default

ai_gateway_policies:
  - ref: sts-lab02-rate-basic
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    display_name: sts-lab02-rate-basic
    name: sts-lab02-rate-basic
    type: rate-limiting
    enabled: true
    config:
      minute: 3
      limit_by: consumer
      policy: local
