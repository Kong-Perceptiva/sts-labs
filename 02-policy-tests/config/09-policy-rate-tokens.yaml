# Scenario 3. One AI Rate Limiting Advanced policy with three sub-policies.
# Each sub-policy matches one consumer group and counts total tokens per
# consumer in a fixed 60-second window. strategy local keeps the counters in
# memory on this Data Plane. identifier consumer is the counter scope.
# The consumer match has no fixed values, so partition_by is true and the
# matched consumer is part of the counter key. There is no fallback sub-policy
# and no monthly cost limit. The policy is not global. It does nothing until
# sts-lab02-chat lists its name.
# Requires AI_GATEWAY_ID.
_defaults:
  kongctl:
    namespace: default

ai_gateway_policies:
  - ref: sts-lab02-rate-tokens
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    display_name: sts-lab02-rate-tokens
    name: sts-lab02-rate-tokens
    type: ai-rate-limiting-advanced
    enabled: true
    config:
      strategy: local
      identifier: consumer
      tokens_count_strategy: total_tokens
      policies:
        - window_type: fixed
          match:
            - type: consumer_group
              key: name
              values:
                - sts-lab02-tier-1
            - type: consumer
              partition_by: true
          limits:
            - limit: 100
              window_size: 60
              tokens_count_strategy: total_tokens
        - window_type: fixed
          match:
            - type: consumer_group
              key: name
              values:
                - sts-lab02-tier-2
            - type: consumer
              partition_by: true
          limits:
            - limit: 200
              window_size: 60
              tokens_count_strategy: total_tokens
        - window_type: fixed
          match:
            - type: consumer_group
              key: name
              values:
                - sts-lab02-tier-3
            - type: consumer
              partition_by: true
          limits:
            - limit: 400
              window_size: 60
              tokens_count_strategy: total_tokens
