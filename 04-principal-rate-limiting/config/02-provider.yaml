# OpenAI provider for Lab 04. The upstream credential is stored in this lab's
# Config Store and read through this lab's vault. The Authorization value is
# the vault reference alone. The stored secret includes the "Bearer " prefix.
# These names start with sts-lab04- so they stay apart from Labs 1, 2, and 3.
# Requires AI_GATEWAY_ID and OPENAI_API_KEY. OPENAI_API_KEY is the raw key.
_defaults:
  kongctl:
    namespace: default

ai_gateway_config_stores:
  - ref: sts-lab04-config-store
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab04-config-store
    display_name: sts-lab04-config-store
    secrets:
      - ref: sts-lab04-openai-auth-header
        ai_gateway_config_store: !ref sts-lab04-config-store
        key: sts-lab04-openai-auth-header
        value: !secret
          parts:
            - "Bearer "
            - !env OPENAI_API_KEY

ai_gateway_vaults:
  - ref: sts-lab04-vault
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab04-vault
    description: Konnect Config Store vault for the Lab 04 OpenAI provider credential.
    type: konnect
    config:
      config_store_id: !ref sts-lab04-config-store#id

ai_gateway_model_providers:
  - ref: sts-lab04-openai
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    name: sts-lab04-openai
    display_name: sts-lab04-openai
    type: openai
    config:
      auth:
        type: basic
        headers:
          - name: Authorization
            value: "{vault://sts-lab04-vault/sts-lab04-openai-auth-header}"
