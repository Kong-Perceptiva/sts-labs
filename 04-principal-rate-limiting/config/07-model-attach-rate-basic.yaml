# Attaches sts-lab04-rate-basic to sts-lab04-chat only.
# Same model spec as config/04-model.yaml. The policies list is the only change.
# Apply config/07-policy-rate-basic.yaml first. The policy name must exist.
# Requires AI_GATEWAY_ID, provider sts-lab04-openai, and auth strategy
# sts-lab04-key-auth.
_defaults:
  kongctl:
    namespace: default

ai_gateway_models:
  - ref: sts-lab04-chat
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    type: model
    name: sts-lab04-chat
    display_name: sts-lab04-chat
    capabilities: [generate]
    formats: [{type: openai}]
    access:
      auth_strategies: [sts-lab04-key-auth]
    config:
      route:
        paths: [/v1]
        model:
          body_param: model
          values: [sts-lab04-chat]
    targets:
      - name: gpt-4o-mini
        provider: sts-lab04-openai
        config:
          type: openai
    policies:
      - sts-lab04-rate-basic
