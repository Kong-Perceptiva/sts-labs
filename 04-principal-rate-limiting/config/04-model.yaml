# Lab 04 chat model. The client sends sts-lab04-chat.
# Kong selects gpt-4o-mini on the provider sts-lab04-openai.
# policies is empty. This file is the unrestricted baseline.
# Re-apply it to detach a model-scoped policy. Do not set global on a policy
# and do not attach a policy in this file.
# Requires AI_GATEWAY_ID, provider sts-lab04-openai, and auth strategy
# sts-lab04-key-auth.
_defaults:
  kongctl:
    namespace: default

ai_gateway_models:
  - ref: sts-lab04-chat
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    type: model
    name: sts-lab04-chat
    display_name: sts-lab04-chat
    capabilities: [generate]
    formats: [{type: openai}]
    access:
      auth_strategies: [sts-lab04-key-auth]
    config:
      route:
        paths: [/v1]
        model:
          body_param: model
          values: [sts-lab04-chat]
    targets:
      - name: gpt-4o-mini
        provider: sts-lab04-openai
        config:
          type: openai
    policies: []
