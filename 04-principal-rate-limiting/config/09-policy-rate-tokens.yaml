# Scenario 3. One AI Rate Limiting Advanced policy with three sub-policies.
# Each sub-policy matches one metadata.tier and counts total tokens in a fixed
# 60-second window. The quotas are 100, 200, and 400. There is no cost limit.
# The published identifier enum has no principal value. expressions.custom_key
# uses metadata.counter_key as a unique counter key. The same metadata field is
# also a partition, so each principal keeps a separate counter for its tier.
# The static custom_key is used only when the expression cannot be evaluated.
# strategy local keeps the counters in memory on this Data Plane.
# The policy is not global. It does nothing until sts-lab04-chat lists its name.
# Requires AI_GATEWAY_ID.
_defaults:
  kongctl:
    namespace: default

ai_gateway_policies:
  - ref: sts-lab04-rate-tokens
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    display_name: sts-lab04-rate-tokens
    name: sts-lab04-rate-tokens
    type: ai-rate-limiting-advanced
    enabled: true
    config:
      strategy: local
      tokens_count_strategy: total_tokens
      custom_key: unknown-principal
      policies:
        - window_type: fixed
          match:
            - type: principal
              key: metadata.tier
              values:
                - t1
            - type: principal
              key: metadata.counter_key
              partition_by: true
          limits:
            - limit: 100
              window_size: 60
              tokens_count_strategy: total_tokens
        - window_type: fixed
          match:
            - type: principal
              key: metadata.tier
              values:
                - t2
            - type: principal
              key: metadata.counter_key
              partition_by: true
          limits:
            - limit: 200
              window_size: 60
              tokens_count_strategy: total_tokens
        - window_type: fixed
          match:
            - type: principal
              key: metadata.tier
              values:
                - t3
            - type: principal
              key: metadata.counter_key
              partition_by: true
          limits:
            - limit: 400
              window_size: 60
              tokens_count_strategy: total_tokens
    expressions:
      custom_key: principal.metadata.counter_key
