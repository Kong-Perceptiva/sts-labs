# Scenario 1. Three requests per 60-second fixed window, counted per principal.
# type is rate-limiting-advanced. The rate-limiting policy limit_by enum has
# no principal value, so that policy type cannot count these callers.
# identifier principal is the documented subject on this policy type.
# window_type fixed and window_size 60 are the one-minute bucket.
# The policy is not global. It does nothing until a model lists its name.
# Requires AI_GATEWAY_ID.
_defaults:
  kongctl:
    namespace: default

ai_gateway_policies:
  - ref: sts-lab04-rate-basic
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    display_name: sts-lab04-rate-basic
    name: sts-lab04-rate-basic
    type: rate-limiting-advanced
    enabled: true
    config:
      identifier: principal
      strategy: local
      window_type: fixed
      limit:
        - 3
      window_size:
        - 60
