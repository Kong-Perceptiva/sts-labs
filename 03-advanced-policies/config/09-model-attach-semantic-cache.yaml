# Same model as 04-model-baseline.yaml.
# Difference: policies is [sts-lab03-semantic-cache].
_defaults:
  kongctl:
    namespace: default

ai_gateway_models:
  - ref: sts-lab03-chat
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    type: model
    name: sts-lab03-chat
    display_name: sts-lab03-chat
    capabilities: [generate]
    formats: [{type: openai}]
    access:
      auth_strategies: [sts-lab03-key-auth]
    config:
      route:
        paths: [/v1]
        model:
          body_param: model
          values: [sts-lab03-chat]
    targets:
      - name: gpt-4o-mini
        provider: sts-lab03-openai
        config:
          type: openai
    policies: [sts-lab03-semantic-cache]
