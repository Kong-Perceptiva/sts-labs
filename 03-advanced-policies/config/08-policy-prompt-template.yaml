# Step 8. Two named templates. A request that does not use one is rejected.
# The policy is not global.
# Requires AI_GATEWAY_ID.
_defaults:
  kongctl:
    namespace: default

ai_gateway_policies:
  - ref: sts-lab03-prompt-template
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    display_name: sts-lab03-prompt-template
    name: sts-lab03-prompt-template
    type: ai-prompt-template
    enabled: true
    config:
      allow_untemplated_requests: false
      templates:
        - name: sts-lab03-api-explainer
          template: |-
            {
              "messages": [
                {
                  "role": "user",
                  "content": "Explain {{technology}} for {{audience}}. Use at most four short sentences."
                }
              ]
            }
        - name: sts-lab03-api-review
          template: |-
            {
              "messages": [
                {
                  "role": "user",
                  "content": "Review this API for {{review_focus}}. Description: {{api_description}}. Use at most four short sentences."
                }
              ]
            }
